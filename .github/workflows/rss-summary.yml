name: Daily RSS to Telegram
on:
  schedule:
    - cron: "37 16 * * *"
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run RSS Summarizer
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py
      - name: Persist cache back to repo
        run: |
          git config user.name "tipmate-radar-bot"
          git config user.email "actions@github.com"
          git add data/cache.json
          git diff --staged --quiet || git commit -m "Update cache [skip ci]"
          git push
